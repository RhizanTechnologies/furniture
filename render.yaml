services:
  - type: web
    name: furniture-erp-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: furniture-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: furniture-erp-db
    plan: starter
    databaseName: furniture_erp
    user: furniture_user
