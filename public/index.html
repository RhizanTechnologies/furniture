<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniture Business ERP - Backend API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf8f5;
      color: #2c1e0f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7ded4;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(44, 30, 15, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      color: #6b5d52;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a {
      display: block;
      background: #4a3525;
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover {
      background: #362416;
    }
    a.secondary {
      background: #f4ede4;
      color: #4a3525;
    }
    a.secondary:hover {
      background: #e8ded2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● API Live & Operational</div>
    <h1>Furniture Business ERP API</h1>
    <p>NestJS & Prisma enterprise modular monolith deployed on Vercel Serverless.</p>
    <div class="links">
      <a href="/api/docs">View Swagger OpenAPI Docs</a>
      <a class="secondary" href="/api/v1/health">System Health Check (/api/v1/health)</a>
    </div>
  </div>
</body>
</html>
