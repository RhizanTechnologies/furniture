services:
  postgres:
    image: postgres:16-alpine
    container_name: furniture_erp_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-furniture_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-furniture_prod_erp}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-furniture_prod_user} -d ${POSTGRES_DB:-furniture_prod_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - furniture_erp_net

  minio:
    image: quay.io/minio/minio:latest
    container_name: furniture_erp_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MinIO root user required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MinIO root password required}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - furniture_erp_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: furniture_erp_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-furniture_prod_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-furniture_prod_erp}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT Secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:?Cookie Secret required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-furniture-erp-uploads}
      S3_FORCE_PATH_STYLE: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - api_prod_uploads:/app/uploads
    ports:
      - "3000:3000"
    networks:
      - furniture_erp_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: furniture_erp_web_prod
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - furniture_erp_net

volumes:
  postgres_prod_data:
  minio_prod_data:
  api_prod_uploads:

networks:
  furniture_erp_net:
    driver: bridge
